name: Publish crates to crates.io

# Two ways to trigger:
#   1. Manual:  Actions tab -> "Publish crates to crates.io" -> Run workflow
#      (simplest - no tag needed).
#   2. Tag:     `git tag vX.Y.Z && git push origin vX.Y.Z`
#
# Requires a repo secret CARGO_REGISTRY_TOKEN containing a crates.io token
# with the `publish` scope. The token is NEVER committed to the repo - it is
# injected at runtime from Settings > Secrets and variables > Actions.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  CARGO_NET_RETRY: "10"

jobs:
  publish:
    name: Publish (topological order)
    runs-on: ubuntu-latest
    # crates.io auth comes from the secret, not GITHUB_TOKEN, so no extra
    # permissions are required here.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # core has no internal deps - publish first. Retry guards against
      # transient crates.io hiccups.
      - name: Publish engvis-core
        run: |
          for i in $(seq 1 10); do
            cargo publish -p engvis-core && break
            echo "publish attempt $i failed, retrying in 20s..."
            sleep 20
          done

      # Each later crate waits (with retry) for the previous version to
      # propagate through the crates.io index before its own publish.
      - name: Publish engvis-surface
        run: |
          for i in $(seq 1 10); do
            cargo publish -p engvis-surface && break
            echo "index not propagated yet (attempt $i), waiting 20s..."
            sleep 20
          done

      - name: Publish engvis-mesher
        run: |
          for i in $(seq 1 10); do
            cargo publish -p engvis-mesher && break
            echo "index not propagated yet (attempt $i), waiting 20s..."
            sleep 20
          done

      - name: Publish engvis-renderer
        run: |
          for i in $(seq 1 10); do
            cargo publish -p engvis-renderer && break
            echo "index not propagated yet (attempt $i), waiting 20s..."
            sleep 20
          done

      # facade `engvis` depends on all four.
      - name: Publish engvis (facade)
        run: |
          for i in $(seq 1 10); do
            cargo publish -p engvis && break
            echo "index not propagated yet (attempt $i), waiting 20s..."
            sleep 20
          done
