name: Publish crates to crates.io

# Two ways to trigger:
#   1. Manual:  Actions tab -> "Publish crates to crates.io" -> Run workflow
#      (simplest - no tag needed).
#   2. Tag:     `git tag vX.Y.Z && git push origin vX.Y.Z`
#
# Requires a repo secret CARGO_REGISTRY_TOKEN containing a *crates.io* token
# (NOT a GitHub token) with the `publish` scope, owned by the crate owner
# account. The token is NEVER committed to the repo - it is injected at
# runtime from Settings > Secrets and variables > Actions.
#
# IMPORTANT: if `cargo publish` fails for every retry (e.g. bad/expired
# token, missing scope, or non-owner account), this workflow FAILS the run
# loudly (exit 1) rather than reporting a silent green success.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  CARGO_NET_RETRY: "10"

jobs:
  publish:
    name: Publish (topological order)
    runs-on: ubuntu-latest
    # crates.io auth comes from the secret, not GITHUB_TOKEN, so no extra
    # permissions are required here.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in topological order
        run: |
          set -euo pipefail
          # All crates share one version via `version.workspace = true`.
          VERSION="$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{print; exit}' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Workspace version: $VERSION"

          # True if <crate>@$VERSION is already on crates.io (idempotency guard).
          # crates.io API requires a User-Agent header.
          already_published() {
            local crate="$1"
            curl -sf -H "User-Agent: engvis-ci" \
              "https://crates.io/api/v1/crates/${crate}" \
              | grep -q "\"num\":\"${VERSION}\""
          }

          # `cargo publish` returns 0 on success, non-zero on failure.
          # A failure caused by the version already existing is treated as a
          # skip (success) so re-triggered tags don't fail the run.
          publish_or_skip() {
            local crate="$1" out
            if out="$(cargo publish -p "$crate" --no-verify 2>&1)"; then
              return 0
            fi
            if echo "$out" | grep -qi "already exists"; then
              echo "::notice::${crate}@${VERSION} already on crates.io - skipping"
              return 0
            fi
            echo "$out"
            return 1
          }

          CRATES=(engvis-core engvis-surface engvis-mesher engvis-renderer engvis)
          for crate in "${CRATES[@]}"; do
            if already_published "$crate"; then
              echo "::notice::${crate}@${VERSION} already on crates.io - skipping (pre-check)"
              continue
            fi
            echo "=== Publishing $crate ==="
            attempt=0
            max=12
            # Retry transient auth/index errors, but give up (exit 1) after
            # `max` attempts so a bad token fails the run loudly, not silently.
            while true; do
              if publish_or_skip "$crate"; then
                break
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Failed to publish $crate after $max attempts"
                exit 1
              fi
              echo "attempt $attempt failed, retrying in 20s..."
              sleep 20
            done
            echo "::notice::Published $crate"
            # Let crates.io index propagate before the next dependent crate.
            sleep 30
          done
